name: Matrix WARN Scraper with Slack Alerts

on:
  schedule:
    # Runs at 15:00 and 20:00 UTC (10am and 3pm EST)
    - cron: '0 15,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    name: Scrape
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 15 # Speeds up execution by running more states at once
      matrix:
        # TESTING: Missouri need to sign up for email. Use [ca, ny, ia] for your first run
        # state: [ny]
        state: [al, ak, az, ca, co, ct, de, fl, ga, hi, id, il, in, ia, ks, me, md, mo, mt, ne, nj, nm, ny, ok, or, pa, ri, sc, sd, tn, tx, ut, vt, va, wa, wi]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper
        run: pip install warn-scraper

      - name: Scrape
        timeout-minutes: 10 # Prevents a single state from hanging the whole run
        run: |
          mkdir -p ./data/
          python -c "from warn.cli import main; import sys; sys.argv=['warn-scraper', '${{ matrix.state }}', '--data-dir', './data/']; main()"

      - name: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.state }}
          path: ./data/${{ matrix.state }}.csv

  commit:
    name: Commit and Alert
    runs-on: ubuntu-latest
    needs: scrape
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so rebase works correctly

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install pandas requests

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts/

      - name: Move and Prepare
        run: |
          mkdir -p data
          # Store the 'old' version of the files before overwriting them
          mkdir -p old_data
          cp data/*.csv old_data/ 2>/dev/null || true
          mv artifacts/**/*.csv data/

      - name: Create Standardized Data and Alerts
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        shell: python
        run: |
          import pandas as pd
          import glob
          import os
          import requests
          from datetime import datetime, timedelta

          token = os.environ.get('SLACK_BOT_TOKEN')
          channel_id = os.environ.get('SLACK_CHANNEL_ID')
          now = datetime.now()
          
          # --- CONSTANTS ---
          TARGET_YEAR = 2026
          # Catch notices with a date within the last 60 days to find late-posted Dec 2025 items
          SLACK_LOOKBACK_DAYS = 60
                    
          URL_MAP = {
              "NY": "https://dol.ny.gov/warn-dashboard",
              "CA": "https://edd.ca.gov/en/Jobs_and_Training/Layoff_Services_WARN",
              "IA": "https://workforce.iowa.gov/employers/resources/warn/notices",
              "TX": "https://www.twc.texas.gov/data-reports/warn-notice",
              "NJ": "https://www.nj.gov/labor/business-services/layoffs-and-closing/file-warn-notice/",
              "SC": "https://scworks.org/employer/employer-resources/warn-notices",
              "FL": "https://www.floridajobs.org/office-directory/division-of-workforce-services/workforce-programs/reemployment-and-emergency-assistance-coordination-team-react/warn-notices",
              "CO": "https://cdle.colorado.gov/employers/layoff-separations/layoff-warn-list",
              "IL": "https://dceo.illinois.gov/workforcedevelopment/warn.html",
              "WI": "https://dwd.wisconsin.gov/dislocatedworker/warn/",
              "PA": "https://www.pa.gov/agencies/dli/programs-services/workforce-development-home/warn-requirements/warn-notices"
              
          }

          # --- HELPER FUNCTIONS ---
          def get_col(df, keywords):
              for col in df.columns:
                  if any(k in str(col).lower() for k in keywords):
                      return col
              return None

          def clean_jobs(val):
              try:
                  val_str = str(val).replace(',', '').split('.')[0].strip()
                  num_str = ''.join(filter(str.isdigit, val_str))
                  if not num_str: return "N/A"
                  num = int(num_str)
                  if num > 1000000: return "N/A"
                  return num
              except:
                  return "N/A"

          def standardize_df(df, state_code):
              # 1. Map columns
              notice_col = get_col(df, ['notice date', 'notice_date', 'date of notice', 'received date', 'date_received', 'date of letter'])
              if not notice_col: notice_col = get_col(df, ['date'])
              co_col = get_col(df, ['company name', 'employer', 'business legal', 'affected_company'])
              if not co_col: co_col = get_col(df, ['company', 'name'])
              jobs_col = get_col(df, ['number of employees', 'num_employees', 'jobs affected', 'total layoff', 'workers affected'])
              if not jobs_col: jobs_col = get_col(df, ['jobs', 'affected'])

              # 2. Extract
              std_df = pd.DataFrame()
              std_df['State'] = [state_code.upper()] * len(df)
              std_df['Company'] = df[co_col].fillna("Unknown") if co_col else "Unknown"
              
              raw_dates = df[notice_col].fillna("N/A") if notice_col else pd.Series(["N/A"] * len(df))
              std_df['Notice Date'] = pd.to_datetime(raw_dates, errors='coerce')
              std_df['Notice Date Raw'] = raw_dates
              std_df['Jobs Affected'] = df[jobs_col].apply(clean_jobs) if jobs_col else "N/A"
              
              return std_df[['State', 'Company', 'Notice Date', 'Jobs Affected', 'Notice Date Raw']]

          all_standardized = []
          new_for_slack = []
          slack_threshold = datetime.now() - timedelta(days=SLACK_LOOKBACK_DAYS)

          for f in sorted(glob.glob("./data/*.csv")):
              if "recent_notices.csv" in f: continue
              state = os.path.basename(f).split(".")[0].upper()
              try:
                  df_clean = standardize_df(pd.read_csv(f), state)
                  all_standardized.append(df_clean)
                  
                  # 3. ADVANCED ALERT LOGIC
                  old_file = f.replace('./data/', './old_data/')
                  if os.path.exists(old_file):
                      df_old = standardize_df(pd.read_csv(old_file), state)
                      # Create unique key to see if we've ever alerted on this specific notice
                      df_clean['key'] = df_clean['Company'].astype(str) + df_clean['Notice Date'].astype(str)
                      df_old['key'] = df_old['Company'].astype(str) + df_old['Notice Date'].astype(str)
                      new_rows = df_clean[~df_clean['key'].isin(df_old['key'])]
                  else:
                      new_rows = df_clean

                  for _, row in new_rows.iterrows():
                      if str(row['Company']).lower() in ['unknown', 'nan', '']: continue
                      # SAFETY NET: Alert if it's brand new AND within our 60-day discovery window
                      if pd.notna(row['Notice Date']) and row['Notice Date'] >= slack_threshold:
                          new_for_slack.append(row.to_dict())
              except: continue

          # 4. DASHBOARD (Strict 2026)
          if all_standardized:
              full_df = pd.concat(all_standardized)
              # Keep the web portal strictly 2026 for the team
              dash_df = full_df[full_df['Notice Date'].dt.year == TARGET_YEAR].copy()
              dash_df = dash_df.sort_values(by='Notice Date', ascending=False)
              dash_df['Notice Date'] = dash_df['Notice Date'].dt.strftime('%Y-%m-%d')
              dash_df.drop(columns=['Notice Date Raw'], errors='ignore').to_csv("./data/recent_notices.csv", index=False)
              
          # Threaded Slack Alerts
          if token and channel_id and new_for_slack:
              header = f"*Daily WARN Report: {now.strftime('%Y-%m-%d')}*"
              resp = requests.post("https://slack.com/api/chat.postMessage", headers={"Authorization": f"Bearer {token}"}, 
                                   json={"channel": channel_id, "text": header}).json()
              ts = resp.get("ts")
              for n in new_for_slack:
                  s_url = URL_MAP.get(n['State'], f"https://www.google.com/search?q={n['State']}+WARN+notices")
                  date_str = n['Notice Date'].strftime('%Y-%m-%d') if pd.notna(n['Notice Date']) else n['Notice Date Raw']
                  payload = {
                      "channel": channel_id, "thread_ts": ts,
                      "blocks": [
                          {"type": "section", "text": {"type": "mrkdwn", "text": f"*New WARN Notice: {n['State']}*\n*Company:* {n['Company']}\n*Jobs affected:* {n['Jobs Affected']}\n*Notice Date:* {date_str}"}},
                          {"type": "actions", "elements": [{"type": "button", "text": {"type": "plain_text", "text": "🔗 View Official Page"}, "url": s_url}]}
                      ]
                  }
                  requests.post("https://slack.com/api/chat.postMessage", headers={"Authorization": f"Bearer {token}"}, json=payload)

      - name: Update Index Page
        shell: python
        run: |
          import glob, os
          from datetime import datetime, timedelta
          # Convert UTC to EST (-5 hours)
          est_time = datetime.utcnow() - timedelta(hours=5)
          content = "# WARN Act Data Portal\n\nAutomated tracking of layoff notices across the U.S.\n\nDoes not include AR, KY, MA, MI, MN, MS, NV, NH, NC, ND, OH, WV, WY\n\n"
          content += f"### Latest Global Update: {est_time.strftime('%Y-%m-%d %I:%M %p')} EST\n\n"
          content += "| State | Data | Source |\n| :--- | :--- | :--- |\n"
          if os.path.exists("./data/recent_notices.csv"):
              content += "| **All States** | [Download Standardized 30-Day CSV](./data/recent_notices.csv) | - |\n"
          for f in sorted(glob.glob("./data/*.csv")):
              if "recent_notices.csv" in f: continue
              st = os.path.basename(f).replace('.csv', '').upper()
              content += f"| {st} | [Raw CSV](./data/{st.lower()}.csv) | [Official](https://www.google.com/search?q={st}+WARN) |\n"
          with open("README.md", "w") as f: f.write(content)

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add ./data/ README.md
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update standardized WARN data [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
